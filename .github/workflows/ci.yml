# CI test gate only. Deployment is on Render (get-cv-paper.onrender.com) via
# render.yaml Blueprint + GitHub auto-deploy; manual trigger via Render dashboard.

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: "20.19"
          cache: npm
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
          npm ci
      - name: Lint Python
        run: ruff check .
      - name: Type check Python
        run: mypy . --ignore-missing-imports
      - name: Lint JavaScript
        run: npm run lint
      - name: Test JavaScript
        run: npm test
      - name: Import check
        run: python -c "import main"
      - name: Test Python with coverage
        run: pytest -q --cov --cov-report=term-missing --cov-fail-under=55
      - name: Build production image
        run: docker build --tag scholarly-ci .
      - name: Smoke production health endpoint
        run: |
          docker run --detach --rm --name scholarly-ci --publish 8000:8000 scholarly-ci
          cleanup() {
            status=$?
            docker logs scholarly-ci || true
            docker stop scholarly-ci || true
            exit "$status"
          }
          trap cleanup EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error http://127.0.0.1:8000/api/health; then
              exit 0
            fi
            sleep 1
          done
          exit 1
